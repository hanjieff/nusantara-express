<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>Data penumpang &mdash; NusantaraExpress</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-mark">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11" /><path d="M4 11h16" /><path d="M3 17h18" /><path d="M7 17v2.5" /><path d="M17 17v2.5" /><circle cx="7.5" cy="14" r=".9" fill="currentColor" stroke="none" /><circle cx="16.5" cy="14" r=".9" fill="currentColor" stroke="none" /></svg>
            </div>
            <div>
              <div class="brand-name">NusantaraExpress</div>
              <div class="brand-sub">Travel within the archipelago</div>
            </div>
          </div>
          <nav class="nav">
            <a class="nav-btn" href="index.html"><span>Beranda</span></a>
            <a class="nav-btn" href="pesanan.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" /><path d="M3.5 4.5V9H8" /><path d="M12 8v4.4l3 1.8" /></svg>
              <span>Pesanan saya</span><span class="badge" id="order-count">0</span>
            </a>
            <div class="user-chip">
              <div class="avatar" id="user-avatar">?</div>
              <span class="user-name" id="user-name"></span>
              <button class="logout" id="btn-logout" type="button">Keluar</button>
            </div>
          </nav>
        </div>
      </header>

      <main>
        <div class="wrap">
          <div class="page-head">
            <div>
              <div class="eyebrow eyebrow-muted">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="6" r="2.4" /><circle cx="18" cy="18" r="2.4" /><path d="M8.4 6H14a3 3 0 0 1 0 6h-4a3 3 0 0 0 0 6h5.6" /></svg>
                Pilih rute
              </div>
              <h1>
                <span id="head-from"></span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6.5 18.5 12 13 17.5" /></svg>
                <span id="head-to"></span>
              </h1>
              <div class="page-sub" id="head-sub"></div>
            </div>
            <div class="stepper">
              <span class="step done"><b>01</b> Trip</span><span class="step-line"></span>
              <span class="step current"><b>02</b> Passenger</span><span class="step-line"></span>
              <span class="step"><b>03</b> Payment</span>
            </div>
          </div>

          <div class="layout">
            <div>
              <section class="panel">
                <h2>Data penumpang</h2>
                <p class="hint">Siapa yang akan bepergian?</p>

                <form class="form-grid" id="form-penumpang" style="margin-top: 22px">
                  <label>
                    <span class="field-label">Nama lengkap</span>
                    <input class="input" id="pax-name" type="text" placeholder="Sesuai KTP" />
                  </label>
                  <label>
                    <span class="field-label">Email</span>
                    <input class="input" id="pax-email" type="email" placeholder="nama@email.com" />
                  </label>
                  <label>
                    <span class="field-label">Nomor telepon</span>
                    <input class="input" id="pax-phone" type="tel" placeholder="081234567890" />
                  </label>
                  <div class="error" id="pax-error" hidden></div>
                  <button class="btn btn-primary btn-lg" type="submit" hidden></button>
                </form>

                <p class="hint" id="pax-note" style="margin-top: 16px"></p>
              </section>

              <div class="foot-actions foot-split">
                <button class="btn btn-ghost" type="button" id="btn-back">Kembali</button>
                <button class="btn btn-primary btn-lg btn-grow" type="button" id="btn-continue">Lanjutkan</button>
              </div>
            </div>

            <aside class="summary">
              <div class="summary-head">
                <span class="label">Ringkasan perjalanan</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11" /><path d="M4 11h16" /><path d="M3 17h18" /><path d="M7 17v2.5" /><path d="M17 17v2.5" /></svg>
              </div>
              <div class="summary-route">
                <span id="sum-from"></span><span class="dashed"></span><span class="dur" id="sum-duration"></span><span class="dashed"></span><span id="sum-to"></span>
              </div>
              <div class="summary-rows">
                <div class="srow"><span>Kelas</span><b id="sum-class"></b></div>
                <div class="srow"><span>Tanggal perjalanan</span><b id="sum-date"></b></div>
                <div class="srow"><span>Keberangkatan</span><b id="sum-time"></b></div>
                <div class="srow"><span>Harga per kursi</span><b id="sum-unit"></b></div>
                <div class="srow"><span>Penumpang</span><b id="sum-pax"></b></div>
                <div class="srow"><span>Subtotal</span><b id="sum-subtotal"></b></div>
                <div class="srow srow-discount" id="row-discount" hidden>
                  <span>Diskon rombongan (10%)</span><b id="sum-discount"></b>
                </div>
                <div class="srow"><span>Operator</span><b id="sum-operator"></b></div>
              </div>
              <div class="summary-total"><span class="label">Total</span><b id="sum-total"></b></div>
            </aside>
          </div>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="data.js"></script>
    <script src="store.js"></script>
    <script src="common.js"></script>
    <script src="i18n.js"></script>
    <script src="js/penumpang.js"></script>
  </body>
</html>
