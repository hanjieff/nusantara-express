<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>Pesanan saya &mdash; NusantaraExpress</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-mark">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11" /><path d="M4 11h16" /><path d="M3 17h18" /><path d="M7 17v2.5" /><path d="M17 17v2.5" /><circle cx="7.5" cy="14" r=".9" fill="currentColor" stroke="none" /><circle cx="16.5" cy="14" r=".9" fill="currentColor" stroke="none" /></svg>
            </div>
            <div>
              <div class="brand-name">NusantaraExpress</div>
              <div class="brand-sub">Travel within the archipelago</div>
            </div>
          </div>
          <nav class="nav">
            <a class="nav-btn" href="index.html"><span>Beranda</span></a>
            <a class="nav-btn" href="pesanan.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" /><path d="M3.5 4.5V9H8" /><path d="M12 8v4.4l3 1.8" /></svg>
              <span>Pesanan saya</span><span class="badge" id="order-count">0</span>
            </a>
            <div class="user-chip">
              <div class="avatar" id="user-avatar">?</div>
              <span class="user-name" id="user-name"></span>
              <button class="logout" id="btn-logout" type="button">Keluar</button>
            </div>
          </nav>
        </div>
      </header>

      <main>
        <div class="wrap">
          <div class="section-head" style="margin-top: 6px">
            <div>
              <div class="eyebrow eyebrow-muted">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8V6.5A1.5 1.5 0 0 1 5.5 5h13A1.5 1.5 0 0 1 20 6.5V8a3 3 0 0 0 0 8v1.5A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5V16a3 3 0 0 0 0-8Z" /><path d="M12 8.5v7" /></svg>
                Riwayat lokal
              </div>
              <h2>Pesanan saya</h2>
            </div>
            <a class="btn btn-primary" href="index.html">Pesan rute lain</a>
          </div>

          <div id="order-list"></div>
          <div class="empty" id="order-empty" hidden>Belum ada pesanan. Mulai dari memilih rute di beranda.</div>
        </div>
      </main>

      <footer class="footer">NusantaraExpress 1.0.0 &middot; Data pesanan tersimpan lokal di perangkat ini, tanpa database.</footer>
    </div>

    <template id="tpl-order">
      <article class="order">
        <div class="order-main">
          <div class="order-route">
            <span data-field="from"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6.5 18.5 12 13 17.5" /></svg>
            <span data-field="to"></span>
          </div>
          <div class="order-sub">
            <span class="mono" data-field="code"></span>
            <span data-field="when"></span>
            <span data-field="kelas"></span>
            <span data-field="pax"></span>
            <span data-field="method"></span>
          </div>
        </div>
        <div class="order-side">
          <div class="status" data-field="status"></div>
          <div class="order-total" data-field="total"></div>
        </div>
        <div class="order-actions">
          <button class="btn btn-ghost btn-sm" type="button" data-field="ticket">Tiket</button>
          <button class="btn btn-ghost btn-sm" type="button" data-field="cancel">Batalkan</button>
        </div>
      </article>
    </template>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="data.js"></script>
    <script src="store.js"></script>
    <script src="common.js"></script>
    <script src="i18n.js"></script>
    <script src="js/pesanan.js"></script>
  </body>
</html>
